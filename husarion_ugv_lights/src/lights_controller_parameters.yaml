lights_controller:
  animations_config_path:
    type: string
    default_value: ""
    description: Path to a YAML file with a description of LED configuration. This file includes definition of robot panels, virtual segments and default animations.
    validation: { not_empty<> }

  controller_frequency:
    type: double
    default_value: 50.0
    description: Frequency in Hz at which the lights controller node will process animations.
    validation: { gt<>: 0.0 }

  frame_keepalive_period:
    type: double
    default_value: 0.0
    description: Time in seconds after which an unchanged panel frame is published again. Above 0
      frames are otherwise published only when they change, and the repeat restores a strip that
      lost its frame, for example after a power glitch. A frame the driver dropped is not repeated before the period
      expires, so it is capped at 5 s. 0 publishes every frame.
    validation: { bounds<>: [0.0, 5.0] }

  user_led_animations_path:
    type: string
    default_value: ""
    description: Path to a YAML file with a description of the user defined animations.
