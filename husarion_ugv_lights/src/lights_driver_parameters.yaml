lights_driver:
  frame_timeout:
    type: double
    default_value: 0.1
    description: Time in seconds after which an incoming frame will be considered too old.
    validation: { gt<>: 0.0 }

  global_brightness:
    type: double
    default_value: 1.0
    description: LED global brightness. The range should be between [0.0, 1.0].
    validation: { bounds<>: [0.0, 1.0] }

  led_output_enabled:
    type: bool
    default_value: true
    description: Startup state of the physical LED output. When false the driver keeps
      receiving frames and the animation topics keep publishing, but nothing is written to
      the strip. Runtime control is the lights/enable service.

  spi_speed_hz:
    type: int
    default_value: 800000
    description: SPI clock of both LED channels in Hz. 800000 is the clock the robot was
      EMC tested with; a different clock changes the strip cable's emissions and needs a new EMC
      check before it ships. The DMA completion of a frame busy-waits until the FIFO drains, so
      that cost falls as the clock rises.
    validation: { bounds<>: [100000, 20000000] }

  spi_max_transfer_bytes:
    type: int
    default_value: 0
    description: Largest single SPI transfer in bytes. A longer frame is sent as several transfers
      of one SPI message, with the chip select held for the whole frame. Below 96 bytes the
      Raspberry Pi SPI controller sends interrupt driven instead of by DMA. 0 sends each frame as
      one transfer.
    validation: { bounds<>: [0, 4096] }

  channel_1_num_led:
    type: int
    default_value: 46
    description: Number of LEDs in the first bumper.
    validation: { gt<>: 0 }

  channel_2_num_led:
    type: int
    default_value: 46
    description: Number of LEDs in the second bumper.
    validation: { gt<>: 0 }
